<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0F16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Media Deck">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Media Deck · Astakhov Team</title>
<style>
:root{--void:#0A0F16;--hull:#121A24;--rim:#243444;--rim-hot:#3A5068;--amber:#FFB13C;
--go:#5FE3A1;--text:#E2EAF3;--muted:#7A8B9E;--dim:#54677B;
--coral:#D97757;--coral-hi:#E8927A}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--text);padding:22px 18px 60px;
font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto}
.eyebrow{font-family:Consolas,monospace;font-size:11px;letter-spacing:.22em;
text-transform:uppercase;color:var(--dim)}
h1{font-size:27px;margin:5px 0 3px;font-weight:800;color:var(--coral)}
h1 em{font-style:normal;color:inherit}
.sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.searchrow{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:16px;
min-height:32px}
#mag{width:32px;height:32px;padding:0;background:none;border:1px solid var(--rim);
color:var(--muted);font-size:14px;line-height:1;cursor:pointer;flex:none}
#mag:hover{color:var(--coral);border-color:var(--coral)}
#mag.on{color:var(--coral);border-color:var(--coral)}
.search{width:0;opacity:0;padding:0;border:0;font:inherit;font-size:14px;
background:var(--hull);color:var(--text);transition:width .18s,opacity .18s;min-width:0}
.search.open{width:min(320px,60vw);opacity:1;padding:6px 11px;border:1px solid var(--rim)}
.search:focus{outline:2px solid var(--coral);outline-offset:1px}
.search::placeholder{color:var(--dim)}
.tab .cnt{color:var(--dim);font-weight:400;font-size:12.5px;margin-left:6px}
.tab.on .cnt{color:var(--coral)}
#up{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border:1px solid var(--rim);
background:var(--hull);color:var(--muted);font-size:18px;cursor:pointer;display:none;line-height:1}
#up:hover{color:var(--coral);border-color:var(--coral)}
.tabs{display:flex;border-bottom:1px solid var(--rim);margin:14px 0 4px}
.tab{flex:1;background:none;border:0;border-bottom:2px solid transparent;
color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:13px 10px;
cursor:pointer;transition:.14s;text-align:center;line-height:1.25}
.tab:first-child{border-right:1px solid var(--rim)}
.tab:hover{color:var(--text)}
.tab.on{color:var(--coral);border-bottom-color:var(--coral)}
@media(max-width:520px){.tab{font-size:13.5px;padding:11px 6px}}
h2{display:none}
.sech{font-size:15px;font-weight:700;color:var(--text);margin:26px 0 2px}
.sec:first-child .sech{margin-top:18px}
.secsub{font-family:Consolas,monospace;font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.sorter{display:flex;gap:0;margin:0 0 13px;border:1px solid var(--rim);width:max-content}
.sorter button{background:none;border:0;border-right:1px solid var(--rim);color:var(--muted);
font:inherit;font-size:12px;padding:5px 13px;cursor:pointer}
.sorter button:last-child{border-right:0}
.sorter button.on{background:var(--coral);color:#150C08;font-weight:700}
.card .v{font-family:Consolas,monospace;font-size:11px;color:var(--dim)}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.card .v{margin-left:10px;color:var(--muted)}
.card .cop{background:none;border:1px solid var(--rim);color:var(--dim);font:inherit;
font-size:11px;padding:3px 9px;cursor:pointer;white-space:nowrap;transition:.12s}
.card .cop:hover{color:var(--coral);border-color:var(--coral)}
.card .cop.ok{color:var(--go);border-color:var(--go)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--hull),#0E141C);border:1px solid var(--rim);
overflow:hidden;cursor:pointer;transition:.14s}
.card:hover{border-color:var(--coral);transform:translateY(-2px)}
.card .thumb{position:relative;aspect-ratio:16/9;background:#0B1119;display:block;width:100%}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font-size:34px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);opacity:.9}
.card .body{padding:11px 13px 13px}
.card .t{font-size:14.5px;font-weight:600;line-height:1.35}
.card .d{font-family:Consolas,monospace;font-size:11px;color:var(--dim);margin-top:6px}
.player{grid-column:1/-1;border:1px solid var(--coral);background:#000}
.player iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.player .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;
padding:9px 13px;background:var(--hull);font-size:13px}
.player a{color:var(--coral);text-decoration:none;font-size:12.5px;white-space:nowrap}
.player button{background:none;border:1px solid var(--rim);color:var(--muted);
padding:5px 11px;cursor:pointer;font:inherit;font-size:12.5px}
.player button:hover{color:var(--text);border-color:var(--rim-hot)}
.lockrow{display:flex;justify-content:flex-end;margin-top:20px}
.lock{background:var(--hull);border:1px solid var(--rim);padding:22px;width:min(400px,100%)}
@media(max-width:520px){.lockrow{justify-content:stretch}}
.lock p{margin:0 0 14px;font-size:13.5px;color:var(--muted)}
.lock input{width:100%;font:inherit;font-size:16px;text-align:center;letter-spacing:3px;
padding:11px;border:1px solid var(--rim);background:#0B1119;color:var(--text);margin-bottom:10px}
.lock input:focus{outline:2px solid var(--coral);outline-offset:1px}
.pw{position:relative}
.pw input{padding-right:46px}
#eye{position:absolute;right:5px;top:3px;width:38px;height:38px;padding:0;background:none;
border:0;color:var(--muted);font-size:17px;cursor:pointer;line-height:1}
#eye:hover{color:var(--text);background:none}
.lock button{width:100%;font:inherit;font-size:15px;padding:11px;border:0;
background:var(--coral);color:#150C08;font-weight:700;cursor:pointer}
.lock button:hover{background:var(--coral-hi)}
.lock button:disabled{opacity:.6;cursor:default}
.err{color:#ff8f8f;font-size:13px;min-height:19px;margin-top:9px}
.empty{color:var(--dim);font-size:13.5px;padding:14px 0}
.localnote{display:none;border-left:2px solid var(--coral);padding:3px 0 3px 12px;
color:var(--muted);font-size:13px;margin:-14px 0 20px}
</style></head>
<body><div class="wrap">
<div class="eyebrow">Astakhov Team · Rocinante</div>
<h1>Media <em>Deck</em></h1>
<div class="sub">Вебинары, обучение, разборы. Новое появляется сверху.</div>
<div class="localnote" id="localnote">Файл открыт с диска - видео здесь не проигрывается,
карточка уводит на YouTube. На сайте плеер работает.</div>

<div class="searchrow">
  <button id="mag" type="button" title="Поиск" aria-label="Поиск" onclick="toggleSearch()">&#128269;</button>
  <input id="q" class="search" type="search" placeholder="Поиск по названию"
         autocomplete="off" autocapitalize="off" spellcheck="false" oninput="filter()">
</div>
<div class="tabs" role="tablist">
  <button class="tab on" id="tab-open" role="tab" onclick="show('open')">Записи эфиров Grand Opening<span class="cnt" id="cnt-open"></span></button>
  <button class="tab" id="tab-partners" role="tab" onclick="show('partners')">Бизнес материалы<span class="cnt" id="cnt-partners"></span></button>
</div>

<div id="pane-open"><div id="open"></div></div>

<div id="pane-partners" style="display:none">
  <div id="lockbox" class="lockrow">
    <div class="lock">
      <p>Материалы для партнёров команды. Пароль тот же, что у First Income и Ривенделла.</p>
      <form id="f">
        <div class="pw">
          <input id="p" type="password" placeholder="пароль" autocomplete="current-password"
                 autocapitalize="off" autocorrect="off" spellcheck="false">
          <button id="eye" type="button" aria-label="Показать пароль">&#128065;</button>
        </div>
        <button id="go" type="submit">Открыть</button>
      </form>
      <div class="err" id="e" role="status"></div>
    </div>
  </div>
  <div id="partners"></div>
</div>
<button id="up" type="button" title="Наверх" onclick="scrollTo({top:0,behavior:'smooth'})">&#8593;</button>
</div>

<script>
function b(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function card(v){
  var d=document.createElement('div'); d.className='card';
  d.innerHTML='<div class="thumb"><img loading="lazy" src="https://i.ytimg.com/vi/'+v.id+
    '/mqdefault.jpg" alt=""><div class="play">&#9654;</div></div>'+
    '<div class="body"><div class="t"></div><div class="meta"><span class="d">'+
    (v.date||'')+(v.views!=null?('<span class="v">'+v.views+' пр.</span>'):'')+
    '</span><button type="button" class="cop">Скопировать</button></div></div>';
  d.querySelector('.t').textContent=v.title||'';
  d.dataset.t=(v.title||'').toLowerCase();
  d.onclick=function(){open_player(d,v);};
  var cp=d.querySelector('.cop');
  cp.onclick=function(ev){
    ev.stopPropagation();                       // клик по кнопке не должен запускать видео
    var b=this;
    navigator.clipboard.writeText('https://youtu.be/'+v.id).then(function(){
      b.textContent='Скопировано'; b.classList.add('ok');
      setTimeout(function(){b.textContent='Скопировать'; b.classList.remove('ok');},1600);
    }).catch(function(){ b.textContent='Не вышло'; });
  };
  return d;
}
var OPEN_PLAYER=null;
function close_player(){ if(OPEN_PLAYER){OPEN_PLAYER.p.replaceWith(OPEN_PLAYER.card); OPEN_PLAYER=null;} }
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  var q=document.getElementById('q');
  if(q&&q.classList.contains('open')&&document.activeElement===q){ toggleSearch(); return; }
  close_player();
});
// Открытый с диска файл YouTube не пускает: у страницы нет адреса сайта, и плеер
// отвечает Error 153. Поэтому локально карточка просто уводит на YouTube.
var LOCAL = location.protocol === 'file:';
function open_player(cardEl,v){
  if(LOCAL){ window.open('https://youtu.be/'+v.id,'_blank','noopener'); return; }
  close_player();                      // один плеер за раз: два звука одновременно никому не нужны
  var p=document.createElement('div'); p.className='player';
  p.innerHTML='<iframe allowfullscreen allow="fullscreen; picture-in-picture" '+
    'src="https://www.youtube-nocookie.com/embed/'+v.id+'?rel=0&autoplay=1"></iframe>'+
    '<div class="bar"><button type="button" class="cl">Свернуть</button>'+
    '<span style="flex:1"></span>'+
    '<button type="button" class="cp">Скопировать ссылку</button>'+
    '<a target="_blank" rel="noopener" href="https://youtu.be/'+v.id+'">Открыть на YouTube &rarr;</a></div>';
  cardEl.replaceWith(p);
  OPEN_PLAYER={p:p,card:cardEl};
  p.querySelector('.cl').onclick=close_player;
  p.querySelector('.cp').onclick=function(){
    var b=this;
    navigator.clipboard.writeText('https://youtu.be/'+v.id).then(function(){
      b.textContent='Скопировано'; setTimeout(function(){b.textContent='Скопировать ссылку';},1600);
    }).catch(function(){ b.textContent='Не вышло'; });
  };
}
function toggleSearch(){
  var q=document.getElementById('q'), m=document.getElementById('mag');
  var open=q.classList.toggle('open'); m.classList.toggle('on',open);
  if(open){q.focus();} else {q.value=''; filter();}
}
function show(which){
  ['open','partners'].forEach(function(k){
    document.getElementById('pane-'+k).style.display = (k===which)?'':'none';
    document.getElementById('tab-'+k).classList.toggle('on', k===which);
  });
  if(which==='partners'){var i=document.getElementById('p'); if(i&&i.offsetParent) i.focus();}
}
function fill(g,items){
  g.innerHTML='';
  if(!items.length){g.innerHTML='<div class="empty">пока пусто</div>';return;}
  items.forEach(function(v){g.appendChild(card(v));});
}
// Поиск прячет карточки и целые разделы, где ничего не нашлось. Работает только
// по тому, что уже отрисовано: запертая вкладка так и остаётся запертой.
function filter(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  document.querySelectorAll('.sec').forEach(function(sec){
    var shown=0;
    sec.querySelectorAll('.card').forEach(function(c){
      var ok=!q||(c.dataset.t||'').indexOf(q)>=0;
      c.style.display=ok?'':'none'; if(ok)shown++;
    });
    sec.style.display=(q&&!shown)?'none':'';
  });
  counts();
}
function counts(){
  ['open','partners'].forEach(function(k){
    var n=document.querySelectorAll('#'+k+' .card').length;
    var el=document.getElementById('cnt-'+k);
    if(el) el.textContent=n?n:'';
  });
}
function render(box,sections){
  box.innerHTML='';
  (sections||[]).forEach(function(s){
    var sec=document.createElement('div'); sec.className='sec'; box.appendChild(sec);
    if(s.title){var h=document.createElement('div'); h.className='sech'; h.textContent=s.title; sec.appendChild(h);}
    if(s.sub){var p=document.createElement('div'); p.className='secsub'; p.textContent=s.sub; sec.appendChild(p);}
    var items=(s.items||[]).slice();
    var g=document.createElement('div'); g.className='grid';
    // Переключатель нужен там, где список длинный. На двух видео он лишний шум.
    if(items.length>5){
      var sr=document.createElement('div'); sr.className='sorter';
      [['Свежие',function(a,b){return (b.date||'').localeCompare(a.date||'');}],
       ['Популярные',function(a,b){return (b.views||0)-(a.views||0);}]
      ].forEach(function(m,n){
        var btn=document.createElement('button'); btn.type='button'; btn.textContent=m[0];
        if(n===0) btn.className='on';
        btn.onclick=function(){
          sr.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
          btn.classList.add('on'); fill(g,items.slice().sort(m[1]));
        };
        sr.appendChild(btn);
      });
      sec.appendChild(sr);
    }
    sec.appendChild(g);
    fill(g,items);
  });
  counts();
}

addEventListener('scroll',function(){
  document.getElementById('up').style.display = scrollY>500 ? 'block' : 'none';
});
fetch('open.json?t='+Date.now()).then(function(r){return r.json();})
  .catch(function(){return OPEN_FB;})
  .then(function(j){render(document.getElementById('open'),j.sections);});

document.getElementById('eye').addEventListener('click',function(){
  var p=document.getElementById('p');
  p.type = p.type==='password' ? 'text' : 'password';
  p.focus();
});
document.getElementById('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var go=document.getElementById('go'), er=document.getElementById('e');
  var pass=document.getElementById('p').value.trim().toLowerCase();
  if(!pass){er.textContent='Введи пароль';return;}
  go.disabled=true; go.textContent='Открываю...'; er.textContent='';
  fetch('partners.enc?t='+Date.now()).then(function(r){return r.json();})
   .catch(function(){return ENC_FB;}).then(function(E){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:b(E.salt),iterations:E.iter,hash:'SHA-256'},k,
        {name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.iv)},key,b(E.data));});
  }).then(function(buf){
    var j=JSON.parse(new TextDecoder().decode(buf));
    document.getElementById('lockbox').style.display='none';
    render(document.getElementById('partners'),j.sections);
    filter();   // если в поиске уже что-то набрано, применяем и к открывшемуся
    // Расшифровали один раз - вкладка остаётся открытой, пароль больше не спрашиваем
  }).catch(function(){
    go.disabled=false; go.textContent='Открыть'; er.textContent='Пароль не подошёл';
  });
});
